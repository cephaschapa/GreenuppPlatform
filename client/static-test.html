<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greenupp - Static Test</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background-color: #000;
      color: white;
      height: 100%;
    }
    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .content {
      max-width: 600px;
    }
    h1 {
      font-size: 48px;
      margin-bottom: 20px;
      color: #00cc66;
    }
    p {
      font-size: 18px;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 12px 24px;
      background-color: #00cc66;
      color: black;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn:hover {
      background-color: #00aa55;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="content">
      <h1>Greenupp</h1>
      <p>A cutting-edge agricultural platform that transforms farm management through intelligent, mobile-first technologies with robust offline capabilities.</p>
      <a href="#" class="btn">Get Started</a>
    </div>
  </div>
</body>
</html>
