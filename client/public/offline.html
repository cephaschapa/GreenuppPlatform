<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Greenupp - Offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: #000000;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      text-align: center;
    }
    
    .container {
      max-width: 600px;
      width: 100%;
    }
    
    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      color: #00FF00;
    }
    
    p {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    
    .logo {
      font-size: 3rem;
      margin-bottom: 2rem;
      color: #00FF00;
    }
    
    .button {
      display: inline-block;
      background-color: #00FF00;
      color: #000000;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      font-size: 1rem;
      margin-top: 1rem;
      transition: all 0.3s ease;
    }
    
    .button:hover {
      background-color: #00CC00;
    }

    .offline-icon {
      font-size: 5rem;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">GREENUPP</div>
    <div class="offline-icon">📡</div>
    <h1>You are offline</h1>
    <p>We can't load the requested page because you appear to be offline. Some features and content are still available from your most recent visits.</p>
    <p>Once you're back online, you'll be able to access all of Greenupp's features again.</p>
    <a href="/" class="button">Try again</a>
  </div>

  <script>
    // Check if the user is back online
    window.addEventListener('online', () => {
      window.location.reload();
    });
    
    // Add event listener to the button
    document.querySelector('.button').addEventListener('click', (e) => {
      if (!navigator.onLine) {
        e.preventDefault();
        alert('You are still offline. Please check your connection and try again.');
      }
    });
  </script>
</body>
</html>
