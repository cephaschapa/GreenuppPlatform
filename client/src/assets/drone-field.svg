<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - green field -->
  <rect width="800" height="600" fill="#0D1117"/>
  <rect width="800" height="300" y="300" fill="#0A3622"/>
  
  <!-- Field patterns -->
  <g opacity="0.3">
    <path d="M0 350 L800 350" stroke="#06E775" stroke-width="1" />
    <path d="M0 400 L800 400" stroke="#06E775" stroke-width="1" />
    <path d="M0 450 L800 450" stroke="#06E775" stroke-width="1" />
    <path d="M0 500 L800 500" stroke="#06E775" stroke-width="1" />
    <path d="M0 550 L800 550" stroke="#06E775" stroke-width="1" />
    
    <path d="M100 300 L100 600" stroke="#06E775" stroke-width="1" />
    <path d="M200 300 L200 600" stroke="#06E775" stroke-width="1" />
    <path d="M300 300 L300 600" stroke="#06E775" stroke-width="1" />
    <path d="M400 300 L400 600" stroke="#06E775" stroke-width="1" />
    <path d="M500 300 L500 600" stroke="#06E775" stroke-width="1" />
    <path d="M600 300 L600 600" stroke="#06E775" stroke-width="1" />
    <path d="M700 300 L700 600" stroke="#06E775" stroke-width="1" />
  </g>
  
  <!-- Stars in the sky -->
  <g>
    <circle cx="50" cy="50" r="1" fill="#FFFFFF" />
    <circle cx="150" cy="80" r="1" fill="#FFFFFF" />
    <circle cx="250" cy="30" r="1" fill="#FFFFFF" />
    <circle cx="350" cy="90" r="1" fill="#FFFFFF" />
    <circle cx="450" cy="40" r="1" fill="#FFFFFF" />
    <circle cx="550" cy="70" r="1" fill="#FFFFFF" />
    <circle cx="650" cy="20" r="1" fill="#FFFFFF" />
    <circle cx="750" cy="60" r="1" fill="#FFFFFF" />
    
    <circle cx="100" cy="120" r="1" fill="#FFFFFF" />
    <circle cx="200" cy="150" r="1" fill="#FFFFFF" />
    <circle cx="300" cy="100" r="1" fill="#FFFFFF" />
    <circle cx="400" cy="180" r="1" fill="#FFFFFF" />
    <circle cx="500" cy="130" r="1" fill="#FFFFFF" />
    <circle cx="600" cy="160" r="1" fill="#FFFFFF" />
    <circle cx="700" cy="110" r="1" fill="#FFFFFF" />
    
    <circle cx="75" cy="200" r="1" fill="#FFFFFF" />
    <circle cx="175" cy="230" r="1" fill="#FFFFFF" />
    <circle cx="275" cy="190" r="1" fill="#FFFFFF" />
    <circle cx="375" cy="250" r="1" fill="#FFFFFF" />
    <circle cx="475" cy="210" r="1" fill="#FFFFFF" />
    <circle cx="575" cy="240" r="1" fill="#FFFFFF" />
    <circle cx="675" cy="180" r="1" fill="#FFFFFF" />
  </g>
  
  <!-- Drone -->
  <g transform="translate(400, 200)">
    <!-- Drone body -->
    <rect x="-40" y="-10" width="80" height="20" rx="5" fill="#2F2F2F" stroke="#06E775" stroke-width="1" />
    
    <!-- Drone camera lens -->
    <circle cx="0" cy="0" r="8" fill="#111111" stroke="#06E775" stroke-width="1" />
    <circle cx="0" cy="0" r="4" fill="#06E775" opacity="0.7" />
    
    <!-- Drone arms -->
    <line x1="-50" y1="-5" x2="-80" y2="-25" stroke="#2F2F2F" stroke-width="3" />
    <line x1="50" y1="-5" x2="80" y2="-25" stroke="#2F2F2F" stroke-width="3" />
    <line x1="-50" y1="5" x2="-80" y2="25" stroke="#2F2F2F" stroke-width="3" />
    <line x1="50" y1="5" x2="80" y2="25" stroke="#2F2F2F" stroke-width="3" />
    
    <!-- Drone rotors -->
    <circle cx="-80" cy="-25" r="15" fill="none" stroke="#06E775" stroke-width="1" stroke-dasharray="2,2">
      <animateTransform attributeName="transform" type="rotate" from="0 -80 -25" to="360 -80 -25" dur="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="-25" r="15" fill="none" stroke="#06E775" stroke-width="1" stroke-dasharray="2,2">
      <animateTransform attributeName="transform" type="rotate" from="0 80 -25" to="360 80 -25" dur="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="-80" cy="25" r="15" fill="none" stroke="#06E775" stroke-width="1" stroke-dasharray="2,2">
      <animateTransform attributeName="transform" type="rotate" from="0 -80 25" to="360 -80 25" dur="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="25" r="15" fill="none" stroke="#06E775" stroke-width="1" stroke-dasharray="2,2">
      <animateTransform attributeName="transform" type="rotate" from="0 80 25" to="360 80 25" dur="1s" repeatCount="indefinite" />
    </circle>
  </g>
  
  <!-- Scan lines from drone -->
  <path d="M350 250 L250 400" stroke="#06E775" stroke-width="1" stroke-dasharray="5,5" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="2s" repeatCount="indefinite" />
  </path>
  <path d="M450 250 L550 400" stroke="#06E775" stroke-width="1" stroke-dasharray="5,5" opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="0" to="20" dur="2s" repeatCount="indefinite" />
  </path>
  
  <!-- Data visualization elements -->
  <g transform="translate(200, 450)" opacity="0.8">
    <rect x="0" y="0" width="60" height="15" fill="#06E775" opacity="0.3" />
    <rect x="0" y="20" width="40" height="15" fill="#06E775" opacity="0.3" />
    <rect x="0" y="40" width="80" height="15" fill="#06E775" opacity="0.3" />
    <text x="65" y="12" font-family="monospace" font-size="12" fill="#06E775">Moisture: 68%</text>
    <text x="45" y="32" font-family="monospace" font-size="12" fill="#06E775">pH: 6.5</text>
    <text x="85" y="52" font-family="monospace" font-size="12" fill="#06E775">Nitrogen: High</text>
  </g>
  
  <!-- Digital grid overlay effect -->
  <g opacity="0.1">
    <rect width="800" height="600" fill="none" stroke="#06E775" stroke-width="1" />
    <path d="M0 100 L800 100" stroke="#06E775" stroke-width="0.5" />
    <path d="M0 200 L800 200" stroke="#06E775" stroke-width="0.5" />
    <path d="M0 300 L800 300" stroke="#06E775" stroke-width="0.5" />
    <path d="M0 400 L800 400" stroke="#06E775" stroke-width="0.5" />
    <path d="M0 500 L800 500" stroke="#06E775" stroke-width="0.5" />
    
    <path d="M100 0 L100 600" stroke="#06E775" stroke-width="0.5" />
    <path d="M200 0 L200 600" stroke="#06E775" stroke-width="0.5" />
    <path d="M300 0 L300 600" stroke="#06E775" stroke-width="0.5" />
    <path d="M400 0 L400 600" stroke="#06E775" stroke-width="0.5" />
    <path d="M500 0 L500 600" stroke="#06E775" stroke-width="0.5" />
    <path d="M600 0 L600 600" stroke="#06E775" stroke-width="0.5" />
    <path d="M700 0 L700 600" stroke="#06E775" stroke-width="0.5" />
  </g>
</svg>
